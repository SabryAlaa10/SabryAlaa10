  <text x="150" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7d99">Organized by Microsoft Egypt · 2026</text>
  <rect x="700" y="150" width="120" height="30" rx="15" fill="#0d3321" stroke="#2dd458" stroke-width="1"/>
  <text x="760" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#3fe27a" text-anchor="middle">✔ Attended</text>

