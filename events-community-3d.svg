  <text x="450" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">Learning beyond courses — through community, discussions &amp; shared experience</text>

  <!-- Card 1 -->
  <g filter="url(#dropshadow)">
